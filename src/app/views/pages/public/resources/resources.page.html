<div class="d-flex align-items-center justify-content-between">
    <h1 class="fw-bold text-theme-dark"><i class="fas fa-folder-open me-4"></i>{{i18s.getValue("resources.title")}}</h1>
    <!-- <div class="t-resources">{{resources.length}} {{i18s.getValue("resources.resources-found")}}</div> -->
    <div>
        <div id="filter-mobile"
            class=" d-flex align-items-center cursor-pointer bg-theme-dark text-theme-light rounded   py-1 px-2"
            [ngClass]="{'active' : showFilterCategory}" (click)="showFilterCategory=!showFilterCategory">
            <span>{{i18s.getValue("resources.filter")}}</span>

            <icon-angle class="svg-path-light ms-2 d-flex align-items-center"
                [direction]=" (showFilterCategory) ? 'down' : 'right'" [width]="18" [height]="18"></icon-angle>
        </div>


    </div>
</div>

<div *ngIf="showFilterCategory" class="d-flex  justify-content-lg-end overflow-x-auto hide-scrollbar my-2">
    <div class="cursor-pointer hover-animation-resize  text-theme-light rounded bg-theme-dark  text-nowrap me-2 px-2 py-1"
        *ngFor="let c of categories" (click)="categoryActive = c">
        {{c.name}}
    </div>
</div>

<p class="d-flex align-items-center flex-wrap justify-content-between my-2">
    <span class="fw-bold text-theme-dark mb-0">{{categoryActive.name}}</span>
    <span>{{resources.length}} {{i18s.getValue("resources.resources-found")}}</span>
</p>

<hr />

<div class="d-flex align-items-center justify-content-between ">
    <div class="d-flex align-items-center hover-animation-resize cursor-pointer " id="select-random-button"
        (click)="randomResource()">
        <icon-dice [style.transform]="'rotate(-45deg)'"></icon-dice>
        <span class="ms-2">{{i18s.getValue("resources.random-button")}}</span>
    </div>
    <component-card-style-selector></component-card-style-selector>
</div>

<div class="my-4">

    <div class="mt-4">
        <div class="row" *ngIf="cardViewerStyle == constantsPortalService.CARD_VIEWER_STYLE_CARD">
            <div *ngFor="let r of resources | categoryPipe:categoryActive.id ; "
                class="col-lg-4 col-md-6 mb-4  hover-animation-resize">
                <a [routerLink]="['/projects', r.id]" class="text-decoration-none">
                    <component-card [image]="r.img" [heading]="r.name" [description]="r.description"></component-card>
                </a>
            </div>
        </div>
        <div *ngIf="cardViewerStyle == constantsPortalService.CARD_VIEWER_STYLE_LIST">
            <div class="mb-4 " *ngFor="let r of resources | categoryPipe:categoryActive.id ; ">
                <a [routerLink]="['/projects', r.id]" class="text-decoration-none ">
                    <component-list-card [description]="r.description" [heading]="r.name"
                        [image]="r.img"></component-list-card>
                </a>
            </div>
        </div>
    </div>
</div>
