<form #formLogin="ngForm" style="height: 80vh;">
    <div class="d-flex flex-column  position-relative top-50 start-50 translate-middle ">
        <img [src]="imagePath" class="size-xl apply-mobile-style align-self-center mb-5" loading="lazy">
        <div class="d-flex flex-column flex-md-row">
            <input type="password" name="password" id="input-password"
                [placeholder]="i18s.getValue('admin-mode.login.input-key')" class=" p-3 border-0  rounded form-control"
                ngModel />

            <div class="btn-login-icon 
            text-theme-light bg-theme-dark cursor-pointer hover-animation-resize
            d-inline p-3 rounded d-flex justify-content-between align-items-center mt-4 mt-md-0 ms-md-4"
                (click)="login(formLogin)">
                <div class="fw-bold d-md-none">{{i18s.getValue('admin-mode.login.button')}}</div>
                <icon-sign-in class="svg-path-light"></icon-sign-in>
            </div>
        </div>
    </div>
</form>
