<div class="modal-container {{opened?'active':''}}" *ngIf="opened">
    <div class="bg"></div>
    <div class="admin-modal">
        <div class="header">
            <h1 class="title size-l title-light ">{{title}}</h1>
            <div (click)="toggle()"> <i class="close-button fas fa-times"></i></div>
        </div>
        <div class="modal-content">
            <ng-content></ng-content>
        </div>
    </div>
</div>
