<div class="card-component">
    <a *ngIf="link; else cardBody" [href]="link.href" [target]="link.target" [rel]="link.rel">
        <ng-container [ngTemplateOutlet]="cardBody"></ng-container>
    </a>
</div>

<ng-template #cardBody>
    <img [src]="image" class="unselectable rounded" loading="lazy">
    <div class="mt-2 mx-1">
        <h3 class="mb-1">
            {{heading}}
        </h3>
        <p class="mb-0 description">{{description}}</p>
    </div>
</ng-template>
