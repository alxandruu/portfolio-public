<div class="position-sticky start-0 top-0  py-3" id="navigation-menu">
    <div class="container-fluid d-flex align-items-center container-lg">
        <a class="website-logo unselectable d-flex align-items-center " routerLink="">
            <i class="fas fa-bed me-3"></i>
            <span>Gabriel Alexandru Botas</span>
        </a>
        <div class="ms-auto"></div>

        <div class="hamburguer-menu   {{showHamburguerMenu ? 'active': ''}} d-md-none">
            <button class="hamburguer border-0 position-relative" (click)="showHamburguerMenu = !showHamburguerMenu">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </button>
            <div class="position-absolute top-0 end-0 p-4 pb-0 hamburguer-links d-flex flex-column justify-content-between"
                *ngIf="showHamburguerMenu" @fadeInOutAnimation>
                <ul class="overflow-y-auto p-0 mb-3 menu-links">
                    <li class="my-5">
                        <a href="/projects" class="link">{{i18s.getValue("navbar.projects")}}</a>
                    </li>
                    <li class="my-5">
                        <a href="/resources" class="link">{{i18s.getValue("navbar.resources")}}</a>
                    </li>
                    <li class="my-5">
                        <a href="https://github.com/alxandruu" target="_blank" rel="noopener noreferrer" class="link"><i
                                class="fab fa-github me-3"></i><span>Github</span></a>
                    </li>

                </ul>
                <div class="d-flex justify-content-between align-items-center flex-wrap">
                    <div class="language-selection unselectable d-flex flex-wrap ">
                        <div *ngFor="let lng of i18s.languages" class="lang-selector me-4 pb-4 "
                            (click)="i18s.changeLanguage(lng.id)">{{lng.description}}</div>
                    </div>
                    <component-theme-switcher></component-theme-switcher>
                </div>
            </div>

        </div>

        <ul class="d-md-flex align-items-center p-0 m-0  menu-links d-none">
            <li class="me-4"><a routerLink="/projects" routerLinkActive="active"
                    class="link text-decoration-none">{{i18s.getValue("navbar.projects")}}</a></li>
            <li class="me-4"><a routerLink="/resources" routerLinkActive="active"
                    class="link text-decoration-none">{{i18s.getValue("navbar.resources")}}</a></li>
            <li class="me-4"><a href="https://github.com/alxandruu" target="_blank" rel="noopener noreferrer" class="text-decoration-none"><i
                        class="fab fa-github me-2"></i><span>Github</span></a></li>
            <component-theme-switcher></component-theme-switcher>
        </ul>
    </div>
</div>
<!-- Scroll Top Button -->
<div class="scroll-top-button position-fixed bottom-0 end-0 me-3 mb-3" *ngIf="scrollY > 250" (click)="scrollTop()"
    @fadeInOutAnimation>
    <i class="fas fa-chevron-up"></i>
</div>
