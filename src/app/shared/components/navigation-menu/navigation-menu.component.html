<div class="position-sticky start-0 top-0  py-3" id="navigation-menu">
    <div class="container-fluid d-flex align-items-center">
        <a class="website-logo unselectable d-flex align-items-center " routerLink="">
            <i class="fas fa-bed me-3"></i>
            <span>Gabriel Alexandru Botas</span>
        </a>
        <div class="ms-auto"></div>

        <div class="hamburguer-menu  {{showHamburguerMenu ? 'active': ''}}">
            <button class="hamburguer border-0 position-relative" (click)="showHamburguerMenu = !showHamburguerMenu">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </button>
            <div class="position-absolute top-0 end-0 p-5 hamburguer-links d-flex flex-column justify-content-between" *ngIf="showHamburguerMenu" @fadeInOutAnimation>
                <ul class="overflow-y-auto p-0 mb-3">
                    <li class="my-5">
                        <a href="/projects">{{i18next.getValue("navbar.projects")}}</a>
                    </li>
                    <li class="my-5">
                        <a href="/resources">{{i18next.getValue("navbar.resources")}}</a>
                    </li>
                    <li class="my-5">
                        <a href="https://github.com/alxandruu" target="_blank" rel="noopener noreferrer"><i
                                class="fab fa-github me-3"></i><span>Github</span></a>
                    </li>

                </ul>
                <div class="d-flex justify-content-between align-items-center">
                    <div class="language-selection unselectable d-flex">
                        <div class="lang-selector" (click)="i18next.changeLanguage('es')">ES</div>
                        <div class="lang-selector ms-4" (click)="i18next.changeLanguage('en')">EN</div>
                        <div class="lang-selector ms-4" (click)="i18next.changeLanguage('ro')">RO</div>
                    </div>
                    <div class="theme-switcher unselectable ms-5 ">
                        <div class="switcher light text-center" (click)="changeThemeScheme('light')" *ngIf="themeScheme == 'dark'">
                            <span class="text">Light</span> <i class="fas fa-sun ms-2"></i>
                        </div>
                        <div class="switcher dark text-center" (click)="changeThemeScheme('dark')" *ngIf="themeScheme == 'light'">
                            <span class="text">Dark</span> <i class="fas fa-moon ms-2"></i>
                        </div>
                    </div>
                </div>
            </div>

        </div>
